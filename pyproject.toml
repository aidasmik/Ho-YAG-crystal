[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoyag-sim"
version = "0.8.0"
description = "Ho:YAG thin-disk structured-light and modal resonator simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]
plots = ["matplotlib>=3.7"]
viewer = ["pyvista>=0.43", "trame>=3", "trame-vtk>=2", "trame-vuetify>=2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
ybluag = ["data/*.part*"]
