name: Stage 7W polarization closure
on:
  push:
    branches: [stage7w-polarization]
    paths: ['src/hoyag/polarization_tracking.py','src/hoyag/polarized_resonator.py','src/hoyag/polarized_validation.py','tests/test_stage7w*','examples/stage7w*','.github/workflows/stage7w.yml']
  pull_request:
    paths: ['src/hoyag/polarization_tracking.py','src/hoyag/polarized_resonator.py','src/hoyag/polarized_validation.py','tests/test_stage7w*','examples/stage7w*','.github/workflows/stage7w.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,plots]'
      - run: |
          mkdir -p results/stage7w/tests
          python -m pytest tests/test_stage7w.py tests/test_stage7w_plan.py -q --junitxml=results/stage7w/tests/junit.xml
          python audit/deep_check.py
          cp results/deep_audit/report.json results/stage7w/tests/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage7w-tests
          path: results/stage7w/tests
          retention-days: 30
  representative:
    needs: unit-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [reference,modes_4,modes_8,sensitivity_support_free]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,plots]'
      - run: python examples/stage7w_validation.py plan --output /tmp/stage7w.json
      - name: Run representative case with unchanged scientific tolerances
        run: |
          python examples/stage7w_validation.py run --plan /tmp/stage7w.json \
            --cases '${{ matrix.case }}' --seconds-per-case 2400 \
            --output results/stage7w/evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage7w-case-${{ matrix.case }}
          path: results/stage7w/evidence
          retention-days: 30
