name: Stage 7V source snapshot
on:
  push:
    branches: [stage7v-qualification]
    paths: ['.github/workflows/stage7v-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          mkdir -p /tmp/stage7v-snapshot
          git archive --format=zip HEAD -o /tmp/stage7v-snapshot/repository.zip
          git rev-parse HEAD > /tmp/stage7v-snapshot/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stage7v-source-snapshot
          path: /tmp/stage7v-snapshot
          retention-days: 7
