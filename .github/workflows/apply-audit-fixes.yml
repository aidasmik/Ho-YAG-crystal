name: Validate and publish audited corrections
on:
  workflow_dispatch:
  push:
    branches: [fix-stage0-7]
    paths: ['audit/apply_source_fixes.py', 'audit/payload/**', '.github/workflows/apply-audit-fixes.yml']
permissions:
  contents: read
jobs:
  validate-corrections:
    if: github.ref == 'refs/heads/fix-stage0-7'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply explicit source edits to the verified audit base
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code b55a1faf462f6433d4e9401a000682426de46467 -- src/hoyag
          cp -r audit/payload/* .
          python audit/apply_source_fixes.py
          rm -rf audit/payload
          rm audit/apply_source_fixes.py
          python -m compileall -q src/hoyag tests
          mkdir -p /tmp/correction-checks
      - run: python -m pip install -e '.[dev,plots]'
      - name: Full regression suite including new physical tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests -q --junitxml=/tmp/correction-checks/pytest.xml | tee /tmp/correction-checks/pytest.log
      - name: Rerun every independent audit probe
        shell: bash
        run: |
          set -euo pipefail
          python audit/deep_check.py | tee /tmp/correction-checks/deep-audit.log
      - name: Coupled 10 W hot-cavity regression
        shell: bash
        run: |
          set -euo pipefail
          python examples/stage7_hot_cavity.py --quick --require-converged --output results/audit_fixes/stage7 | tee /tmp/correction-checks/stage7.log
      - name: Record exact verification and commit only checked source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          suites=ET.parse('/tmp/correction-checks/pytest.xml').getroot().findall('.//testsuite')
          counts={k:sum(int(s.attrib.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          audit=json.loads(Path('results/deep_audit/report.json').read_text())
          hot=json.loads(Path('results/audit_fixes/stage7/summary.json').read_text())
          assert counts['failures']==counts['errors']==0
          assert not audit['failed_checks']
          assert hot['converged']
          record={'original_base':'b55a1faf462f6433d4e9401a000682426de46467','verification_run_id':int(os.environ['RUN_ID']),
                  'migration_revision':os.environ['EXPECTED_HEAD'],'regression':counts,
                  'independent_probes_executed':len(audit['checks']),'independent_probes_failed':audit['failed_checks'],
                  'independent_probe_results':audit['checks'],'stage7_converged':hot['converged'],
                  'stage7_last_iteration':hot.get('last_iteration'),'stage7_budget':hot.get('energy_budget'),
                  'limitations':'Coarse-grid hot-cavity regression, not a mesh/mode-count or experimental validation.'}
          Path('results/audit_fixes').mkdir(exist_ok=True)
          Path('results/audit_fixes/verification.json').write_text(json.dumps(record,indent=2,allow_nan=False)+'\n')
          print('FIX_VERIFICATION '+json.dumps({k:v for k,v in record.items() if k!='independent_probe_results'}))
          PY
          rm .github/workflows/apply-audit-fixes.yml
          git config user.name 'Aidas Mikalauskas'
          git config user.email '89588091+aidasmik@users.noreply.github.com'
          git add src/hoyag tests pyproject.toml README.md audit/deep_check.py docs/AUDIT_FIXES_STAGE0_7.md results/audit_fixes/verification.json
          git add -u
          git diff --cached --check
          git commit -m 'Fix audited population layout, complex reference, pump spectrum and validation defects'
          remote_head=$(git ls-remote origin refs/heads/fix-stage0-7 | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/fix-stage0-7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-corrections-verification
          path: |
            /tmp/correction-checks
            results/deep_audit/report.json
            results/audit_fixes
