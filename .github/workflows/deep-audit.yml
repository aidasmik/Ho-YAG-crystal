name: Independent Stage 0-7 audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/hoyag/**'
      - 'audit/**'
      - '.github/workflows/deep-audit.yml'
  pull_request:
    paths:
      - 'src/hoyag/**'
      - 'audit/**'
      - '.github/workflows/deep-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,plots]'
      - name: Full regression suite
        run: python -m pytest tests -q
      - name: Independent audit probes (any failure fails this job)
        run: python audit/deep_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-stage0-7-audit
          path: results/deep_audit
