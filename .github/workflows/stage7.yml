name: Stage 7 coupled demonstration
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/hoyag/vector_cavity.py'
      - 'src/hoyag/coupled_resonator.py'
      - 'examples/stage7_hot_cavity.py'
      - 'config/stage7_hot_cavity.json'
      - '.github/workflows/stage7.yml'
permissions:
  contents: read
jobs:
  coupled-example:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,plots]'
      - run: python -m pytest tests/test_stage7.py -q
      - run: python examples/stage7_hot_cavity.py --quick --require-converged --output results/stage7/generated
      - run: python examples/stage7_plot.py --result results/stage7/generated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage7-coupled-run
          path: results/stage7/generated
